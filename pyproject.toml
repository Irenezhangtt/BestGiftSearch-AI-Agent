[project]
name = "best-gift-search"
version = "0.1.0"
description = "Multi-agent global gift discovery and comparison API"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/best_gift_search"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
