services:
  api:
    build:
      context: .
      args:
        INSTALL_AI: ${INSTALL_AI:-false}
    environment:
      BEST_GIFT_DB: /data/best_gift_search.db
      BEST_GIFT_CORS: http://localhost:5173
      BEST_GIFT_RATE_LIMIT: ${BEST_GIFT_RATE_LIMIT:-120}
      BEST_GIFT_API_KEY: ${BEST_GIFT_API_KEY:-}
      BEST_GIFT_MODEL_PROVIDER: ${BEST_GIFT_MODEL_PROVIDER:-auto}
      BEST_GIFT_OPENAI_MODEL: ${BEST_GIFT_OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BEST_GIFT_CATALOG_URL: ${BEST_GIFT_CATALOG_URL:-}
      BEST_GIFT_CATALOG_TOKEN: ${BEST_GIFT_CATALOG_TOKEN:-}
    volumes:
      - gift-data:/data
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  gift-data:
